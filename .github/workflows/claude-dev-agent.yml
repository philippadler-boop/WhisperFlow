name: Claude Dev Agent

# M8 (unattended work): separate from claude.yml on purpose. claude.yml
# stays the interactive @claude-mention workflow; this one picks up an
# issue with no human in the loop once it's labeled `claude-dev`, and runs
# in automation mode (a `prompt` input, so Claude doesn't wait for a
# mention -- see code.claude.com/docs/en/github-actions, "Interactive and
# automation modes").
on:
  issues:
    types: [labeled]

jobs:
  dev-agent:
    if: github.event.label.name == 'claude-dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on the PR it opens
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code (developer agent, unattended)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY_DEV }}

          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }}
            ("${{ github.event.issue.title }}") in this repository.

            Follow the conventions in CLAUDE.md: work on a dedicated
            feature branch (never commit directly to main), include tests
            for the behavior you add, and run the build/tests/linters
            locally before finishing.

            Open a pull request whose title references issue
            #${{ github.event.issue.number }} (e.g. include
            "#${{ github.event.issue.number }}" in the title) -- this repo's
            traceability CI check requires an FR-xxx or #N reference in the
            PR title, and will fail the PR without it.

            The PR body must also contain a literal, correctly-formed
            GitHub closing-keyword line -- e.g. "Closes #${{ github.event.issue.number }}"
            or "Fixes #${{ github.event.issue.number }}" -- with the keyword
            immediately followed by "#${{ github.event.issue.number }}" and
            no other words in between. This is required in addition to the
            title reference: the title alone satisfies traceability.yml but
            does not auto-close the issue on merge, since GitHub only reads
            closing keywords from the PR body or commit messages, never the
            title. Do not use a non-closing reference like "Refs #N" or
            phrasing like "closes issue #N" -- both fail to close the issue
            even though they look like they should (see issue #74).

            Do not merge the PR yourself. Merge is always a human action in
            this repo, gated on CI passing and an independent review.

          # --agent is a documented `claude` CLI flag (code.claude.com/docs/en/cli-reference).
          # Confirmed working through claude_args in the Action's automation
          # mode: a second smoke-test run (throwaway issue #50, 2026-09-04,
          # after the --allowedTools fix below) showed the session's own
          # "init" event reporting "tools": ["Read","Edit","Write","Bash",
          # "Grep","Glob"] -- exactly developer.md's declared tool list, not
          # the full default Claude Code toolset -- so the agent config is
          # genuinely loaded, not silently falling back to the default agent.
          #
          # --model sonnet: belt-and-suspenders pin (issue #59). developer.md
          # now carries its own `model: sonnet` frontmatter, which the
          # resolution chain (per-invocation override -> agent frontmatter ->
          # CLAUDE_CODE_SUBAGENT_MODEL -> main conversation's model) already
          # honors on its own -- confirmed by invocation, not just by reading
          # the YAML: `claude --agent developer` with no override reports
          # "model": "claude-sonnet-5" in its init event, and overriding with
          # `--model haiku` genuinely changes that to
          # "claude-haiku-4-5-20251001", proving the field is read, not
          # ignored. Pinning it here too means this workflow doesn't silently
          # drift if developer.md's frontmatter is ever edited or removed
          # without this file being touched in the same change.
          #
          # --allowedTools is NOT optional here: per code.claude.com's own
          # docs, automation mode (a `prompt` input) gives Claude no
          # shell/GitHub tool access at all until granted explicitly via
          # --allowedTools or a `settings` permissions.allow rule. A first
          # smoke-test run (throwaway issue #48, 2026-09-04) confirmed this
          # the hard way: it completed with exit success and zero errors,
          # but produced no branch/commit/PR/comment and
          # permission_denials_count: 20 in the result JSON -- every tool
          # call the developer agent tried was silently denied. The list
          # below mirrors developer.md's own `tools:` line exactly, so this
          # grants no more than the subagent already has when run locally.
          claude_args: '--agent developer --model sonnet --allowedTools "Bash,Edit,Write,Read,Grep,Glob"'

          # Kept on through the M8 pilot (T002): the Action hides the full
          # conversation transcript by default, which is what made the #48
          # smoke test's failure (permission_denials_count: 20) opaque until
          # this was turned on for the #50 re-test. Worth keeping visible
          # for the first real unattended PR too, so its run log is fully
          # inspectable rather than trust-me-it-worked. Revisit turning it
          # back off once M8 closes.
          show_full_output: true

          # github_token is deliberately omitted. Leaving it unset makes
          # the Action authenticate as the Claude GitHub App instead of the
          # default GITHUB_TOKEN. GitHub does not trigger downstream
          # workflows (CI, traceability) on commits pushed with the default
          # GITHUB_TOKEN, and M5's CI gate depends on CI actually running
          # on the resulting PR.

      # No auto-merge step here, deliberately. The PR this produces sits
      # exactly like every other PR in this repo: CI must pass, `reviewer`
      # and `qa` still run as separate, manually-invoked sessions (not
      # automated by M8), and a human merges. The point of M8 is proving
      # unattended work clears the same gates, not skipping them.
