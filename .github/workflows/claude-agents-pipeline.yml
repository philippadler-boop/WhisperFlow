name: Claude Agents Pipeline

# M8 (unattended work): separate from claude.yml on purpose. claude.yml
# stays the interactive @claude-mention workflow; this one runs in
# automation mode (a `prompt` input, so Claude doesn't wait for a mention
# -- see code.claude.com/docs/en/github-actions, "Interactive and
# automation modes") for three distinct triggers:
#
#   1. issues/labeled (claude-dev label) -- pick up a fresh task and open
#      a new PR. Original M8 behavior, unchanged.
#   2. pull_request_review/submitted (state: changes_requested) -- NEW.
#      A reviewer requested changes on an existing PR; check out that
#      PR's own branch and push a fix commit there, instead of opening a
#      new PR. `reviewer` itself is still a manually-invoked local
#      session (per the M8 scope decision -- see CLAUDE.md's Subagents
#      section), so this does not create a fully closed, unsupervised
#      review loop: a human still has to run `reviewer` and choose to
#      post each request-changes review. The round cap below (env
#      MAX_AUTO_FIX_ROUNDS) is a cheap safety net for that path anyway,
#      not a fix for a loop that doesn't structurally exist yet -- it
#      guards against the case where request-changes reviews get posted
#      faster than a human is actually watching (e.g. a scripted/piped
#      reviewer invocation, as this repo has started doing).
#   3. pull_request/opened,synchronize -- feature 002 (reviewer/qa
#      automation), dispatches `reviewer-agent` (see that job's own `if:`
#      below). Fires both right after `dev-agent`'s issues/labeled run
#      opens a brand-new PR (`opened`) and after every subsequent
#      automation-pushed fix commit (`synchronize`), per ADR 0009. Scoped
#      tightly by a `sender` actor check on the job itself (see
#      `reviewer-agent`) so this does not fire `reviewer` on every PR in
#      the repository -- see that job's own comment for why an
#      `event_name` guard is also required there, not just the actor
#      check ADR 0009 names.
#
# UNVERIFIED as of this draft, same as every genuinely new mechanism in
# this file has been treated before being trusted (--agent, --allowedTools,
# --model all needed a real throwaway-issue run to confirm): the
# `pull_request_review.review.state` string casing ("changes_requested",
# lowercase -- GitHub's webhook payload docs say lowercase, but this repo
# hasn't observed it directly), the round-count `gh api`/jq query, and the
# multi-line GITHUB_OUTPUT prompt-building step. Smoke-test all of this
# with a throwaway PR + a real `gh pr review --request-changes` before
# trusting it on real work, same discipline as every prior change here.
# `reviewer-agent`'s new `pull_request` trigger (T106) is equally
# unverified until the same throwaway-PR smoke test also exercises it.
# That "multi-line GITHUB_OUTPUT prompt-building step" scope explicitly
# includes reviewer-agent's own, more complex two-step-chained instance of
# the pattern (T109): "Fetch PR diff" writes a randomized-delimiter
# GITHUB_OUTPUT, and "Build prompt for reviewer" both reads that prior
# step's output via env: and writes its own randomized-delimiter
# GITHUB_OUTPUT in turn, before that value is finally substituted into
# claude-code-action's `prompt:` with:-field -- one more hop than the
# single-step instances of this pattern elsewhere in this file, and thus
# with correspondingly more surface for a throwaway-PR run to exercise.
on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]

env:
  # Safety net for the pull_request_review path only (see the "Count
  # prior request-changes rounds" and "Stop and hand back" steps below).
  # Once this many CHANGES_REQUESTED reviews have accumulated on a PR,
  # claude-agents-pipeline stops auto-fixing and posts a comment instead of
  # dispatching another round -- a human needs to look at it directly, or
  # re-invoke `developer` manually to keep going deliberately. Raised from
  # 3 to 5 per Resolved Decision 3 / FR-008 (feature 002,
  # reviewer/qa-automation): with `reviewer`/`qa` now in the automated
  # loop too, 3 rounds proved too tight a cap for the added
  # review/fix/re-review cycles. The counting query and "Stop and hand
  # back" step below are unchanged -- only this constant moves (ADR 0009).
  MAX_AUTO_FIX_ROUNDS: 5

jobs:
  dev-agent:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude-dev') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on the PR it opens
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Always runs (both paths), always produces a valid integer output.
      # Deliberately NOT conditioned on event type: an unconditional step
      # with a safe count=0 default on the issues/labeled path means every
      # later comparison against this output is well-defined regardless of
      # which trigger fired, rather than depending on GitHub Actions'
      # &&/|| short-circuit behavior to avoid comparing against an empty
      # string (that behavior isn't something this repo has verified and
      # isn't worth relying on here when a plain shell default is simpler
      # and unambiguous).
      - name: Count prior request-changes rounds
        id: round_count
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            count=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
              --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length')
          else
            count=0
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Prior CHANGES_REQUESTED reviews on this PR: $count (cap: $MAX_AUTO_FIX_ROUNDS)"

      # Only fires on the review path, and only once the cap is reached.
      # Posts via the default token (a plain API comment, not a git push,
      # so this doesn't touch the "commits must trigger CI" concern that
      # governs the github_token omission further down).
      - name: Stop and hand back to a human if the round cap is reached
        if: >-
          github.event_name == 'pull_request_review' &&
          steps.round_count.outputs.count >= env.MAX_AUTO_FIX_ROUNDS
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROUND_COUNT: ${{ steps.round_count.outputs.count }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<EOF
          Auto-fix round cap ($ROUND_COUNT/$MAX_AUTO_FIX_ROUNDS CHANGES_REQUESTED reviews) reached on this PR -- claude-agents-pipeline is stopping here rather than dispatching another automatic fix. A human should look at the remaining review feedback directly, or re-invoke \`developer\` manually to continue deliberately.
          EOF
          )"
          echo "::notice::Round cap reached ($ROUND_COUNT/$MAX_AUTO_FIX_ROUNDS) -- skipping the Claude Code step."

      # Builds the prompt for whichever trigger fired, since the two paths
      # need genuinely different instructions (open a new PR vs. push a
      # fix to an existing one) and GitHub Actions expressions can't
      # cleanly hold a multi-line ternary. Skips (leaving `prompt` unset)
      # once the round cap is reached, which the next step keys off of to
      # skip Claude entirely rather than run it with an empty prompt.
      #
      # SECURITY: issue titles and PR review bodies are attacker-
      # controlled free text (anyone who can open an issue or leave a
      # review controls this content). They are passed in via `env:` and
      # referenced as `"$VAR"` inside the heredoc below, never spliced
      # directly into this run: block's script text via `${{ }}`. This
      # matters because `${{ }}` substitution happens at the YAML level,
      # before bash ever parses the script -- text containing backticks,
      # `$(...)`, or quotes spliced in that way becomes part of the
      # script's *source code*, not data, and can execute arbitrary
      # commands on the runner. A bash variable expansion (`$VAR`) is a
      # single-pass substitution -- its value is inserted as plain text
      # and is never re-parsed as further shell syntax -- which is why
      # this is safe even for a hostile title. This is the same pattern
      # traceability.yml already uses for `$PR_TITLE`; see PR #79's review
      # thread (issue #75) for the incident that established it as this
      # repo's standard for handling untrusted webhook text in a `run:`
      # step.
      - name: Build prompt for this trigger
        id: build_prompt
        if: >-
          github.event_name == 'issues' ||
          steps.round_count.outputs.count < env.MAX_AUTO_FIX_ROUNDS
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "prompt<<PROMPT_EOF_8f3a2b91"
            if [ "$EVENT_NAME" = "issues" ]; then
              cat <<BODY
          Implement GitHub issue #$ISSUE_NUMBER
          ("$ISSUE_TITLE") in this repository.

          Follow the conventions in CLAUDE.md: work on a dedicated
          feature branch (never commit directly to main), include tests
          for the behavior you add, and run the build/tests/linters
          locally before finishing.

          Open a pull request whose title references issue
          #$ISSUE_NUMBER (e.g. include "#$ISSUE_NUMBER" in the title) --
          this repo's traceability CI check requires an FR-xxx or #N
          reference in the PR title, and will fail the PR without it.

          The PR body must also contain a literal, correctly-formed
          GitHub closing-keyword line -- e.g. "Closes #$ISSUE_NUMBER" or
          "Fixes #$ISSUE_NUMBER" -- with the keyword immediately followed
          by "#$ISSUE_NUMBER" and no other words in between. This is
          required in addition to the title reference: the title alone
          satisfies traceability.yml but does not auto-close the issue on
          merge, since GitHub only reads closing keywords from the PR
          body or commit messages, never the title. Do not use a
          non-closing reference like "Refs #N" or phrasing like "closes
          issue #N" -- both fail to close the issue even though they look
          like they should (see issue #74).

          Do not merge the PR yourself. Merge is always a human action in
          this repo, gated on CI passing and an independent review.
          BODY
            else
              cat <<BODY
          A reviewer requested changes on PR #$PR_NUMBER in this
          repository ($REPO).

          Fetch the review's actual content yourself before doing
          anything else -- this prompt does not include it:
            gh api repos/$REPO/pulls/$PR_NUMBER/reviews \\
              --jq '[.[] | select(.state=="CHANGES_REQUESTED")] | last | .body'
          Read the real, current review text this way rather than
          guessing at what it might say.

          Check out the branch this PR is already on -- do NOT create a
          new branch, do NOT open a new PR. Address the specific,
          concrete points the review raised; do not expand scope beyond
          what it actually asked for.

          Run the build/tests/linters locally before finishing, exactly
          as you would for a fresh implementation.

          Commit your fix with a clear message referencing that it
          addresses this review round, and push it to this same branch
          -- this updates the existing PR in place. Do NOT open a new PR,
          do NOT create a new branch.

          Do not merge the PR yourself. Merge is always a human action in
          this repo, gated on CI passing and an independent review.
          BODY
            fi
            echo "PROMPT_EOF_8f3a2b91"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code (developer agent, unattended)
        if: steps.build_prompt.outcome == 'success'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_DEV }}

          prompt: ${{ steps.build_prompt.outputs.prompt }}

          # --agent is a documented `claude` CLI flag (code.claude.com/docs/en/cli-reference).
          # Confirmed working through claude_args in the Action's automation
          # mode: a second smoke-test run (throwaway issue #50, 2026-09-04,
          # after the --allowedTools fix below) showed the session's own
          # "init" event reporting "tools": ["Read","Edit","Write","Bash",
          # "Grep","Glob"] -- exactly developer.md's declared tool list, not
          # the full default Claude Code toolset -- so the agent config is
          # genuinely loaded, not silently falling back to the default agent.
          #
          # --model sonnet: belt-and-suspenders pin (issue #59). developer.md
          # now carries its own `model: sonnet` frontmatter, which the
          # resolution chain (per-invocation override -> agent frontmatter ->
          # CLAUDE_CODE_SUBAGENT_MODEL -> main conversation's model) already
          # honors on its own -- confirmed by invocation, not just by reading
          # the YAML: `claude --agent developer` with no override reports
          # "model": "claude-sonnet-5" in its init event, and overriding with
          # `--model haiku` genuinely changes that to
          # "claude-haiku-4-5-20251001", proving the field is read, not
          # ignored. Pinning it here too means this workflow doesn't silently
          # drift if developer.md's frontmatter is ever edited or removed
          # without this file being touched in the same change.
          #
          # --allowedTools is NOT optional here: per code.claude.com's own
          # docs, automation mode (a `prompt` input) gives Claude no
          # shell/GitHub tool access at all until granted explicitly via
          # --allowedTools or a `settings` permissions.allow rule. A first
          # smoke-test run (throwaway issue #48, 2026-09-04) confirmed this
          # the hard way: it completed with exit success and zero errors,
          # but produced no branch/commit/PR/comment and
          # permission_denials_count: 20 in the result JSON -- every tool
          # call the developer agent tried was silently denied. The list
          # below mirrors developer.md's own `tools:` line exactly, so this
          # grants no more than the subagent already has when run locally.
          claude_args: '--agent developer --model sonnet --allowedTools "Bash,Edit,Write,Read,Grep,Glob"'

          # Kept on through the M8 pilot (T002): the Action hides the full
          # conversation transcript by default, which is what made the #48
          # smoke test's failure (permission_denials_count: 20) opaque until
          # this was turned on for the #50 re-test. Worth keeping visible
          # for the first real unattended PR too, so its run log is fully
          # inspectable rather than trust-me-it-worked. Revisit turning it
          # back off once M8 closes.
          show_full_output: true

          # github_token is deliberately omitted. Leaving it unset makes
          # the Action authenticate as the Claude GitHub App instead of the
          # default GITHUB_TOKEN. GitHub does not trigger downstream
          # workflows (CI, traceability) on commits pushed with the default
          # GITHUB_TOKEN, and M5's CI gate depends on CI actually running
          # on the resulting PR. This applies equally to both trigger paths
          # -- the review-triggered fix commit needs CI to re-run just as
          # much as the original implementation commit did.

      # No auto-merge step here, deliberately, on either path. The PR this
      # produces sits exactly like every other PR in this repo: CI must
      # pass, `reviewer` and `qa` still run as separate, manually-invoked
      # sessions (not automated by M8), and a human merges. The point of
      # M8 is proving unattended work clears the same gates, not skipping
      # them -- extending it to review-triggered fixes doesn't change that.

  # T103 (feature 002, reviewer/qa automation): job skeleton, wired for
  # real by T106. Dispatches on the `pull_request`/`opened,synchronize`
  # events added to the workflow-level `on:` block above -- this single
  # trigger definition uniformly covers both the very first review (right
  # after `dev-agent`'s issues/labeled run opens a new PR, firing
  # `opened`) and every re-review after a fix-round push (firing
  # `synchronize`), per ADR 0009's Decision.
  #
  # The `if:` below requires BOTH:
  #   1. `github.event_name == 'pull_request'` -- necessary because this
  #      workflow's `on:` block is shared across three event types
  #      (`issues`, `pull_request_review`, `pull_request`), all of which
  #      carry a `sender` field. Without this guard, the `sender` actor
  #      check alone (condition 2) would also match the `pull_request_review`
  #      event that `qa-agent`'s trigger (T116) depends on once
  #      `reviewer-agent` itself starts posting APPROVE/CHANGES_REQUESTED
  #      reviews as the same bot identity (Phase 4/T113) -- that would
  #      spuriously re-dispatch `reviewer-agent` on its own just-posted
  #      review instead of leaving that event exclusively for `qa-agent`.
  #      ADR 0009's own job-graph rationale (three independent
  #      dispatches, no cross-job overlap) depends on this not happening.
  #   2. `github.event.sender.login == 'claude[bot]' && github.event.sender.type
  #      == 'Bot'` -- the actor-identification check ADR 0007 establishes
  #      and ADR 0009 applies to `sender` (rather than `review.user`, the
  #      field ADR 0007 checks for `qa-agent`) since the relevant actor for
  #      a `pull_request` event is whoever performed the push/open, not the
  #      PR's original author field. `claude[bot]` is the literal login
  #      confirmed empirically per T102 by inspecting a real
  #      `developer`-authored commit's author identity
  #      (`git log --format='%an <%ae>'` on this repo shows
  #      `claude[bot] <209825114+claude[bot]@users.noreply.github.com>` for
  #      every automation-mode commit observed so far) -- not assumed from
  #      the ADRs' own illustrative examples by analogy alone.
  # This check is now load-bearing for two independent jobs'
  # dispatch (this one and, via ADR 0007, `qa-agent`'s) -- per ADR 0009
  # Consequences, it MUST stay scoped this tightly or `reviewer` would run
  # on every PR in the repository, including ones with nothing to do with
  # this automation. It also means a human's own manual commit pushed
  # directly to an automation-managed PR branch will not trigger an
  # automatic re-review (the `sender` won't match) -- intentional and
  # protective, not a gap (ADR 0009 Consequences).
  reviewer-agent:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.sender.login == 'claude[bot]' &&
      github.event.sender.type == 'Bot'
    runs-on: ubuntu-latest
    # Read-only tool grant (Read/Grep/Glob only -- see below), so this job
    # needs no more than read access to repo contents and PRs.
    # `pull-requests: read` is required by the `Fetch PR diff` step (T108)
    # below, whose `gh pr diff` call reads the PR via the default
    # `GITHUB_TOKEN` (exposed to that step as `github.token`) -- it was
    # deliberately not added before T108 landed, since no step used it yet.
    #
    # NOTE (T106): the trigger above is now real, so this job genuinely
    # dispatches on every qualifying `pull_request` event from here on --
    # it is no longer inert. T107 added the `Checkout PR head` step; T108
    # added the `gh pr diff` fetch; T109 (below) adds the `Build prompt for
    # reviewer` step that embeds that fetched diff into `reviewer`'s actual
    # prompt via this job's `prompt:` field, per ADR 0005 Decision 3.
    # `reviewer` therefore now receives a real diff-grounded prompt rather
    # than the static placeholder text this job used through T108.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # T107 (ADR 0005 Decision 1): checks out the PR's own head branch
      # at its current `head.sha` -- deliberately NOT `main` and NOT a
      # bare default-branch checkout -- so `reviewer`'s Read/Grep/Glob
      # calls resolve against the PR's actual current file tree (the
      # context reviewer.md already expects beyond the diff hunks
      # themselves: the architecture doc, the task spec, related files
      # the diff didn't touch). Pinning `ref:` to `head.sha` rather than
      # just the branch name avoids a race where the branch moves between
      # the triggering event and this step actually running, matching the
      # same stale-commit discipline `data-model.md`'s `PRReviewEvent`
      # validation rule requires for the `approved` trigger path (ADR
      # 0005 Consequences). `actions/checkout@v7` and `fetch-depth: 1`
      # mirror `dev-agent`'s own checkout step above for consistency --
      # this job has no need for deeper history, same as that one.
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      # T108 (ADR 0005 Decision 2): fetches the PR's diff via `gh pr diff`
      # and exposes it as this step's own `diff` output. This step's job is
      # only to fetch and expose the diff -- it does NOT wire it into
      # `reviewer`'s prompt; that is T109, a separate task.
      #
      # SECURITY: a PR's diff is exactly as attacker-controlled as the
      # issue titles and review bodies `dev-agent`'s "Build prompt for this
      # trigger" step above already handles (anyone who can push to the PR
      # branch controls this text). Per ADR 0005's Consequences, this step
      # follows that exact `env:`-then-`"$VAR"`-inside-heredoc pattern:
      # `gh pr diff`'s output is captured into the `$DIFF` shell variable
      # (a plain command substitution, not a GitHub Actions `${{ }}`
      # expression -- there is no `${{ }}` form for a command's stdout),
      # then referenced only as `"$DIFF"` inside the heredoc body below. It
      # is never spliced via `${{ }}` directly into this `run:` step's
      # script text, which is what would let hostile diff content (e.g.
      # backticks or `$(...)`) become script *source* rather than data --
      # the same reasoning already documented above for `$ISSUE_TITLE`.
      #
      # The one difference from that step's pattern is the heredoc
      # delimiter: that step uses a fixed string
      # (`PROMPT_EOF_8f3a2b91`), which is fine for a short issue title, but
      # ADR 0005 Decision 2 requires a delimiter generated fresh at runtime
      # here, since a diff's contents are large and attacker-influenced
      # enough that a fixed delimiter risks an accidental collision (a
      # diff line that happens to equal the delimiter would truncate the
      # captured value). `/proc/sys/kernel/random/uuid` is used to generate
      # it -- a Linux kernel feature present since kernel 3.17 with no
      # package to install, unlike `uuidgen` (part of `util-linux`'s
      # `uuid-runtime`, not guaranteed present on every runner image) -- a
      # `$RANDOM`-based token is the fallback if that path is ever
      # unreadable.
      #
      # Per FR-013 and ADR 0005 Consequences, this step fails the job
      # visibly rather than silently continuing if `gh pr diff` fails
      # (already covered by GitHub Actions' default `bash -eo pipefail`
      # invocation of `run:` scripts, per its documented default shell
      # behavior -- a non-zero `gh` exit code fails this step immediately)
      # or if it succeeds but returns empty output (an explicit check
      # below, since a zero exit with empty stdout would otherwise pass
      # `set -e` silently -- e.g. if the PR were closed/emptied between the
      # triggering event and this step running).
      - name: Fetch PR diff
        id: fetch_diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DIFF="$(gh pr diff "$PR_NUMBER" --repo "$REPO")"
          if [ -z "$DIFF" ]; then
            echo "::error::gh pr diff returned empty output for PR #$PR_NUMBER -- refusing to continue with no diff for reviewer to review (FR-013)."
            exit 1
          fi
          DELIM="DIFF_EOF_$(cat /proc/sys/kernel/random/uuid 2>/dev/null || echo "${RANDOM}${RANDOM}${RANDOM}")"
          {
            echo "diff<<$DELIM"
            echo "$DIFF"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Build prompt for reviewer
        id: build_prompt
        # T109 (ADR 0005 Decision 3): embeds the diff fetched above into
        # reviewer's actual prompt, and gives reviewer explicit instructions
        # on how to use its Read/Grep/Glob tools alongside that diff.
        #
        # T111 (ADR 0006 Decision, bullet 1): the static instructional text
        # this step builds (PROMPT_TAIL below) also requires the response to
        # begin with a literal, exact "VERDICT: APPROVE" or
        # "VERDICT: REQUEST_CHANGES" first line, ahead of the human-readable
        # report reviewer.md's Responsibilities section already asks for.
        # This lives entirely here, in the workflow's own prompt-building
        # step -- not in .claude/agents/reviewer.md itself -- per FR-012 and
        # ADR 0006 Consequences ("reviewer.md itself is unchanged"). A later
        # task (T113) adds the workflow step that actually parses this line
        # and dispatches to `gh pr review --approve` /
        # `--request-changes`; this task only adds the instruction text.
        #
        # A dedicated step (id: build_prompt) is used here, mirroring
        # dev-agent's own "Build prompt for this trigger" step above, rather
        # than referencing steps.fetch_diff.outputs.diff directly inside
        # the claude-code-action step's prompt: field below: ADR 0005
        # Decision 3 itself names the target as
        # steps.build_prompt.outputs.prompt -- the same step/output naming
        # convention dev-agent already established -- because the final
        # prompt is not just the raw diff, it is that diff embedded in
        # static instructional text (what to review, how to use
        # Read/Grep/Glob, what not to attempt), which needs a run: step to
        # assemble into one value the same way dev-agent assembles its own
        # two-branch prompt text.
        #
        # SECURITY -- and why this is safe even though T108's run: step
        # would never splice this same diff text via a GitHub Actions
        # expression: this step's own run: script (the part bash actually
        # parses) never contains a GitHub Actions expression at all. The
        # diff arrives via env: DIFF: steps.fetch_diff.outputs.diff and is
        # only ever referenced as the shell variable "$DIFF" below --
        # identical in spirit to how dev-agent's step above handles
        # $ISSUE_TITLE. The diff is deliberately never placed inside a
        # "cat <<DELIM" heredoc here -- only emitted via a plain
        # echo "$DIFF" sandwiched between two heredocs of this repo's own
        # fixed, attacker-free static text -- so a diff line that happens
        # to match a heredoc delimiter word can never truncate it. The one
        # delimiter the diff's own content COULD collide with, the outer
        # GITHUB_OUTPUT boundary, is generated fresh at runtime below (same
        # as the Fetch PR diff step above), not a fixed string, for exactly
        # the reason ADR 0005 Decision 2 already requires that for
        # "diff<<...".
        #
        # Separately: this step's *output* -- steps.build_prompt.outputs.prompt
        # -- IS then referenced via a GitHub Actions expression directly
        # inside the claude-code-action step's prompt: with:-field below,
        # per ADR 0005 Decision 3's exact mechanism. That is safe even
        # though the diff text it carries is exactly as attacker-controlled
        # as it was in T108's run: step, because a with:-field is not a
        # shell script: the expression substitution there happens at the
        # YAML/expression level, and the resulting string is handed to
        # claude-code-action (a JavaScript GitHub Action) as a plain action
        # input -- via the runner's normal INPUT_* environment-variable
        # mechanism -- not concatenated into a command line a shell then
        # re-parses. There is no shell (or any other) interpreter
        # downstream of a with:-field substitution that would treat
        # backticks, command substitutions, or quotes embedded in the diff
        # as anything other than literal characters, which is precisely the
        # property that made splicing the same content into a run: script's
        # *source text* unsafe.
        env:
          DIFF: ${{ steps.fetch_diff.outputs.diff }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DELIM="PROMPT_EOF_$(cat /proc/sys/kernel/random/uuid 2>/dev/null || echo "${RANDOM}${RANDOM}${RANDOM}")"
          {
            echo "prompt<<$DELIM"
            cat <<PROMPT_HEAD
          Independently review pull request #$PR_NUMBER's diff, embedded
          verbatim below between the "--- BEGIN DIFF ---" and
          "--- END DIFF ---" markers. You have not seen the Developer's
          reasoning or conversation -- only this diff, the task spec, and
          the architecture doc, per your own reviewer.md instructions.

          --- BEGIN DIFF ---
          PROMPT_HEAD
            echo "$DIFF"
            cat <<PROMPT_TAIL
          --- END DIFF ---

          The diff above is the complete, authoritative change set for
          this pull request, already fetched by this workflow via
          "gh pr diff". Do not attempt to re-derive, re-fetch, or
          reconstruct it yourself -- you have no Bash, git, or gh tool
          capable of doing that reliably, and none is granted to you in
          this invocation.

          This repository has already been checked out locally at this
          pull request's own head commit. Use your Read, Grep, and Glob
          tools against that checked-out working tree only for context
          beyond the diff hunks themselves -- e.g. the architecture doc,
          the task spec, or related files the diff did not touch -- never
          to reconstruct or re-derive the diff itself.

          Produce your review report as your response: either approve, or
          request changes with specific, actionable points (file/line,
          what is wrong, why it matters), per your own reviewer.md
          responsibilities.

          Your response MUST begin with a machine-readable verdict line as
          the exact first line of your response -- no preamble, blank
          line, heading, or other text before it. That first line must be
          one of these two literal strings, character-for-character, and
          nothing else on the line:

          VERDICT: APPROVE
          VERDICT: REQUEST_CHANGES

          Use "VERDICT: APPROVE" if and only if you are approving the PR
          outright, with no requested changes. Use
          "VERDICT: REQUEST_CHANGES" if you are requesting any changes at
          all, however small. Do not write any paraphrase, summary, or
          variation of these strings (e.g. not "Verdict: Approve", not
          "VERDICT: Approved", not "My verdict is APPROVE", not
          "VERDICT: APPROVE - looks good") -- an automated step
          downstream matches this line by exact literal string comparison
          and will fail the workflow visibly if it does not match either
          literal exactly. After that first line, write your full
          human-readable report (approval rationale, or the specific
          actionable points) on subsequent lines exactly as described
          above.
          PROMPT_TAIL
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code (reviewer agent, unattended)
        uses: anthropics/claude-code-action@v1
        with:
          # Per ADR 0008: each of the three automation-mode invocations
          # (developer, reviewer, qa) references only its own role's
          # secret, as a literal value -- no shared variable, anchor, or
          # computed lookup -- so `reviewer`'s spend is separable from
          # `developer`'s in Anthropic's own usage view and this job
          # cannot silently fall back to ANTHROPIC_API_KEY_DEV.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_REVIEWER }}

          # The diff-grounded prompt built by "Build prompt for reviewer"
          # above (T109, ADR 0005 Decision 3) -- a YAML-level `${{ }}`
          # substitution into this action input, matching how dev-agent's
          # own prompt already flows via `steps.build_prompt.outputs.prompt`
          # above. See that step's own comment for why this substitution
          # is safe here even though the same diff text must never be
          # spliced via `${{ }}` into a `run:` script (T108).
          prompt: ${{ steps.build_prompt.outputs.prompt }}

          # --allowedTools is exactly `Read,Grep,Glob`, per FR-002 and
          # contracts/automation-triggers.md's tool-grant table: reviewer
          # MUST NOT get Write, Edit, Bash, or any git/gh access in
          # automation mode, mirroring .claude/agents/reviewer.md's own
          # `tools:` line -- a reviewer that can fix what it's reviewing,
          # or shell out on its own, isn't an independent review. --model
          # sonnet is a belt-and-suspenders pin, same rationale as
          # `dev-agent`'s own claude_args above (reviewer.md's frontmatter
          # already pins `model: sonnet`, but pinning it again here means
          # this workflow doesn't silently drift if that frontmatter is
          # ever edited without this file being touched in the same
          # change).
          claude_args: '--agent reviewer --model sonnet --allowedTools "Read,Grep,Glob"'

          # github_token is deliberately omitted here too, mirroring
          # dev-agent's existing rationale above: leaving it unset
          # authenticates this step as the Claude GitHub App rather than
          # the default GITHUB_TOKEN. (Unlike dev-agent, this job doesn't
          # push commits -- but per contracts/automation-triggers.md's
          # Review-posting contract, the actual `gh pr review` call that
          # posts reviewer's verdict is a separate workflow step the
          # *workflow* performs, added in a later phase, not something
          # this claude-code-action step does itself.)

  # T104 (feature 002, reviewer/qa automation): job skeleton only, mirroring
  # T103's reviewer-agent skeleton above. The trigger condition below is a
  # deliberate `if: false` placeholder -- this job is wired into the
  # workflow file now (its own isolated tools/secret/permissions grant, per
  # ADR 0008/ADR 0009), but never actually runs until T116 (Phase 5)
  # replaces the placeholder with the real `pull_request_review`/`approved`
  # condition scoped to the automation bot actor. Landing the skeleton
  # first, inert, keeps this PR reviewable in isolation from the
  # trigger-wiring/checkout/commit work that follows (see tasks.md's
  # Phase 2/Phase 5 split).
  qa-agent:
    if: false
    runs-on: ubuntu-latest
    # Read-only tool grant at the GitHub-permissions level (qa's own Claude
    # tool grant below includes Write/Bash, but those act on the
    # job's local, checked-out filesystem, not on repo-level GitHub
    # permissions) -- no checkout or branch-push step exists yet at this
    # skeleton stage. Phase 5 (T117) adds a `Checkout PR branch` step and
    # the commit-and-push of qa's validation report, which will need
    # `contents: write` added here at that point -- not added
    # preemptively since this skeleton has no step that uses it yet.
    permissions:
      contents: read
    steps:
      - name: Run Claude Code (qa agent, unattended)
        uses: anthropics/claude-code-action@v1
        with:
          # Per ADR 0008: each of the three automation-mode invocations
          # (developer, reviewer, qa) references only its own role's
          # secret, as a literal value -- no shared variable, anchor, or
          # computed lookup -- so `qa`'s spend is separable from
          # `developer`'s/`reviewer`'s in Anthropic's own usage view and
          # this job cannot silently fall back to ANTHROPIC_API_KEY_DEV.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_QA }}

          # Placeholder prompt: this step never actually runs while the
          # job-level `if: false` above holds. Phase 5 (T117-T119) adds
          # the checkout and real prompt-building steps (instructing qa to
          # validate the requirement and commit its report onto the PR's
          # own branch, per FR-005/FR-006) that make this meaningful.
          prompt: "Placeholder -- qa-agent's trigger is not wired yet (see tasks.md T116)."

          # --allowedTools is exactly `Read,Bash,Grep,Glob,Write`, copied
          # verbatim (order and all) from .claude/agents/qa.md's own
          # `tools:` frontmatter line ("Read, Bash, Grep, Glob, Write") per
          # FR-005/FR-012 -- qa keeps its full local tool grant (including
          # Bash, to actually run the software, and Write, to commit its
          # validation report) unchanged from interactive use; this task
          # does not paraphrase or narrow that list. --model sonnet is a
          # belt-and-suspenders pin, same rationale as `dev-agent`'s and
          # `reviewer-agent`'s own claude_args above (qa.md's frontmatter
          # already pins `model: sonnet`, but pinning it again here means
          # this workflow doesn't silently drift if that frontmatter is
          # ever edited without this file being touched in the same
          # change).
          claude_args: '--agent qa --model sonnet --allowedTools "Read,Bash,Grep,Glob,Write"'

          # github_token is deliberately omitted here too, mirroring
          # dev-agent's/reviewer-agent's existing rationale above: leaving
          # it unset authenticates this step as the Claude GitHub App
          # rather than the default GITHUB_TOKEN. Phase 5 (T117) adds the
          # checkout-and-push step qa.md's own documented convention
          # requires (commit the validation report onto the PR's existing
          # branch); that push needs the same App-identity authentication
          # dev-agent's fix-round pushes already rely on so it lands on
          # the same PR rather than being silently invisible to it.
