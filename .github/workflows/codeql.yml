name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, independent of PR activity -- catches newly-disclosed
    # vulnerability patterns in code that hasn't otherwise changed.
    - cron: "19 3 * * 1"

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      # No security-events: write -- upload is disabled below (private repo,
      # no GitHub Advanced Security), so the action never calls the
      # code-scanning API that permission would gate.
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for Python source
        id: check
        run: |
          if git ls-files '*.py' | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
            echo "No .py files tracked yet -- nothing for CodeQL to scan. This is expected before T001/T002 land."
          fi
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: steps.check.outputs.has_python == 'true'
        with:
          languages: python
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: steps.check.outputs.has_python == 'true'
        with:
          # This is a private repo without GitHub Advanced Security, so the
          # Security tab / code scanning API isn't available to upload to
          # (SARIF upload fails with "Code scanning is not enabled for this
          # repository"). Analysis still runs and findings are visible in
          # this job's log; revisit if the repo goes public or gets GHAS.
          upload: false
